name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # registry-url is required for OIDC trusted publishing (it's in npm's
      # documented example): it points npm at registry.npmjs.org for the OIDC
      # token exchange. On Node >= 22.14 + npm >= 11.5.1 with a configured
      # trusted publisher, npm mints and uses the OIDC token, overriding the
      # placeholder _authToken setup-node writes. Do NOT add a NODE_AUTH_TOKEN
      # env to the publish step — that reintroduced a real (dummy) token and
      # caused E404 on Node 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) requires npm >= 11.5.1 AND Node >= 22.14.0.
      # Node 22 ships npm 10.x, so install the npm 11.18.0 publisher proven by
      # the successful v3.20.0 release. Do not track the mutable latest tag here.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.18.0

      - name: Install dependencies
        run: npm ci

      - name: Build generated artifacts
        run: npm run build

      - name: Verify generated artifacts are committed
        run: git diff --exit-code -- .claude-plugin bin hooks test lib plugins docs/skill-catalog.html

      - name: Run verify:all
        run: npm run verify:all

      - name: Run tests
        run: node --test test/*.test.mjs

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            echo "Bump package.json on a release PR before tagging."
            exit 1
          fi
          echo "✓ tag v$TAG_VERSION matches package.json $PKG_VERSION"

      # Publishes via OIDC trusted publishing — no NPM_TOKEN secret.
      # Prerequisite: a trusted publisher must be configured on npmjs.com for this
      # repo + workflow file (see docs/RELEASING.md). Provenance attestations are
      # generated automatically from the OIDC claims.
      #
      # Publish with the pinned npm installed by the explicit global upgrade above.
      # Do not launch a second npm through npx: npm 12's temporary npx install
      # omitted the sigstore module and stopped v3.20.3 before registry contact.
      # The version echo proves which global npm executable runs the publish.
      - name: Publish to npm
        run: |
          echo "node $(node -v) / global npm $(npm -v)"
          npm publish --access public --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag

      - name: Update major version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          MAJOR="v${TAG_VERSION%%.*}"
          echo "Updating major version tag $MAJOR -> $GITHUB_REF_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR" -m "$MAJOR -> $GITHUB_REF_NAME"
          git push origin "$MAJOR" --force
          echo "✓ Major version tag $MAJOR updated"

      # continuous-improvement.dev is a Cloudflare Pages DIRECT-UPLOAD project,
      # not a git-connected one, so merging to main never touches the live site.
      # Every release moves the four version markers in docs/landing/index.html,
      # which means a release without a deploy leaves the domain serving the
      # previous version and turns landing-drift.yml red the next morning. That
      # is exactly what happened after v3.22.0 and v3.23.0: the site sat two
      # releases behind and the daily check was red from 2026-09-02.
      #
      # These steps run LAST, after npm and the GitHub release, so a Cloudflare
      # outage can never block the publish. They are gated on the secret being
      # present: without it the deploy is skipped with a warning rather than
      # failing, so a fork — or this repo before the secret is configured —
      # still gets a complete release.
      - name: Check for Cloudflare credentials
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "✓ Cloudflare credentials present — the landing page will be deployed"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set, so the landing page was NOT deployed and continuous-improvement.dev will serve the previous version. Deploy it by hand (see docs/RELEASING.md) or landing-drift.yml will go red within 24h."
          fi

      # Pinned, not @latest: this is the wrangler proven against this project.
      - name: Deploy landing page to Cloudflare Pages
        if: steps.cf.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.104.0 pages deploy docs/landing --project-name=continuous-improvement --branch=main --commit-dirty=true

      # Deploying is not the same as being live. This is the landing-drift check
      # run inline, so a silent no-op deploy fails the release instead of waiting
      # for tomorrow's scheduled run to notice.
      - name: Verify the deployed page serves this version
        if: steps.cf.outputs.configured == 'true'
        run: |
          expected=$(node -p "require('./package.json').version")
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          rev() { curl -fsSL --retry 5 --retry-delay 5 -A "$ua" "$1" 2>/dev/null \
            | grep -oE 'REV [0-9]+\.[0-9]+\.[0-9]+' | head -1 | awk '{print $2}'; }
          # The apex sits behind the customer zone's bot protection, which 403s
          # runner IPs; *.pages.dev is the Cloudflare-managed zone and serves the
          # same deployment. Same fallback order as landing-drift.yml.
          url='https://continuous-improvement.dev/'
          live=$(rev "$url")
          if [ -z "$live" ]; then
            url='https://continuous-improvement.pages.dev/'
            live=$(rev "$url")
          fi
          echo "package.json : $expected"
          echo "live $url : ${live:-<none>}"
          if [ "$expected" != "$live" ]; then
            echo "::error::Landing deploy did not take: serving '${live:-<none>}' but this release is $expected."
            exit 1
          fi
          echo "✓ continuous-improvement.dev is serving $expected"
