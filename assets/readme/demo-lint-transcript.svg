<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 558" width="820" height="558" role="img" aria-labelledby="title desc">
<title id="title">The transcript linter on an unchecked edit</title>
<desc id="desc">ci-lint-transcript scores a two-event session, an edit with no lookup and a commit with no test run, at 43 of 100 with two HIGH violations.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.b{font-weight:600}.bg{fill:#ffffff}.panel{fill:#f6f8fa;stroke:#d0d7de}.rule{stroke:#d0d7de}.tx{fill:#1f2328}.mute{fill:#59636e}.deny{fill:#cf222e}.deny-bg{fill:#ffebe9;stroke:#cf222e}.ok{fill:#1a7f37}.ok-bg{fill:#dafbe1;stroke:#1a7f37}.accent{fill:#0969da}.accent-bg{fill:#ddf4ff;stroke:#0969da}.warn{fill:#9a6700}.warn-bg{fill:#fff8c5;stroke:#9a6700}.arrow{stroke:#59636e;fill:none}.head{fill:#59636e}@media (prefers-color-scheme:dark){.bg{fill:#0d1117}.panel{fill:#161b22;stroke:#3d444d}.rule{stroke:#3d444d}.tx{fill:#f0f6fc}.mute{fill:#9198a1}.deny{fill:#ff7b72}.deny-bg{fill:#3d1214;stroke:#ff7b72}.ok{fill:#3fb950}.ok-bg{fill:#12301c;stroke:#3fb950}.accent{fill:#4493f8}.accent-bg{fill:#0c2d5a;stroke:#4493f8}.warn{fill:#d29922}.warn-bg{fill:#3a2a07;stroke:#d29922}.arrow{stroke:#9198a1;fill:none}.head{fill:#9198a1}}</style>
<rect x="0" y="0" width="820" height="558" rx="12" class="bg"/>
<text x="24" y="48" font-size="24" class="tx b" xml:space="preserve">The transcript linter on an unchecked edit</text>
<text x="24" y="76" font-size="17" class="mute" xml:space="preserve">Captured on 3.27.0 plus the Unreleased changes: demo/captures/demos.json</text>
<rect x="24" y="94" width="772" height="440" rx="8" class="panel"/>
<text x="40" y="134" font-size="18" class="tx mono b" xml:space="preserve">$ ci-lint-transcript session.jsonl</text>
<text x="40" y="160" font-size="19" class="mute" xml:space="preserve">session.jsonl: an Edit of src/app.ts, then a git commit</text>
<line x1="40" y1="174" x2="780" y2="174" class="rule" stroke-width="1"/>
<text x="40" y="204" font-size="18" class="mute mono" xml:space="preserve">## Agent Discipline Report</text>
<text x="40" y="230" font-size="18" class="tx mono b" xml:space="preserve">**Score:** 43/100</text>
<text x="40" y="256" font-size="18" class="mute mono" xml:space="preserve">**Events analyzed:** 2</text>
<text x="40" y="282" font-size="18" class="mute mono" xml:space="preserve">**Tool calls:** 2</text>
<text x="40" y="308" font-size="18" class="mute mono" xml:space="preserve">**Research ops:** 0 | **Write ops:** 1 (1 to source or config</text>
<text x="40" y="334" font-size="18" class="mute mono" xml:space="preserve">files) | **Verify ops:** 0</text>
<text x="40" y="360" font-size="18" class="mute mono" xml:space="preserve">### Violations (2)</text>
<text x="40" y="386" font-size="18" class="deny mono b" xml:space="preserve">- **[HIGH] Law 1: Research Before Executing**</text>
<text x="40" y="412" font-size="18" class="mute mono" xml:space="preserve">  1 write with 0 research operations (first at event 0). Agent</text>
<text x="40" y="438" font-size="18" class="mute mono" xml:space="preserve">  likely skipped research.</text>
<text x="40" y="464" font-size="18" class="deny mono b" xml:space="preserve">- **[HIGH] Law 4: Verify Before Reporting**</text>
<text x="40" y="490" font-size="18" class="mute mono" xml:space="preserve">  1 code change with 0 verification commands (test/build). Agent</text>
<text x="40" y="516" font-size="18" class="mute mono" xml:space="preserve">  may have declared done without verifying.</text>
</svg>
