<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 552" width="640" height="552" role="img" aria-labelledby="title desc">
<title id="title">The transcript linter on an unchecked edit</title>
<desc id="desc">ci-lint-transcript scores a two-event session, an edit with no lookup and a commit with no test run, at 43 of 100 with two HIGH violations, each named after one of the 7 Laws.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.b{font-weight:600}.bg{fill:#ffffff}.panel{fill:#f6f8fa;stroke:#d0d7de}.rule{stroke:#d0d7de}.tx{fill:#1f2328}.mute{fill:#59636e}.deny{fill:#cf222e}.deny-bg{fill:#ffebe9;stroke:#cf222e}.ok{fill:#1a7f37}.ok-bg{fill:#dafbe1;stroke:#1a7f37}.accent{fill:#0969da}.accent-bg{fill:#ddf4ff;stroke:#0969da}.warn{fill:#9a6700}.warn-bg{fill:#fff8c5;stroke:#9a6700}.arrow{stroke:#59636e;fill:none}.head{fill:#59636e}@media (prefers-color-scheme:dark){.bg{fill:#0d1117}.panel{fill:#161b22;stroke:#3d444d}.rule{stroke:#3d444d}.tx{fill:#f0f6fc}.mute{fill:#9198a1}.deny{fill:#ff7b72}.deny-bg{fill:#3d1214;stroke:#ff7b72}.ok{fill:#3fb950}.ok-bg{fill:#12301c;stroke:#3fb950}.accent{fill:#58a6ff}.accent-bg{fill:#0c2d5a;stroke:#58a6ff}.warn{fill:#d29922}.warn-bg{fill:#3a2a07;stroke:#d29922}.arrow{stroke:#9198a1;fill:none}.head{fill:#9198a1}}</style>
<rect x="0" y="0" width="640" height="552" rx="12" class="bg"/>
<text x="24" y="46" font-size="22" class="tx b" xml:space="preserve">The transcript linter on an unchecked edit</text>
<rect x="24" y="62" width="592" height="466" rx="8" class="panel"/>
<text x="40" y="102" font-size="18" class="tx mono" xml:space="preserve"><tspan class="b">$ </tspan><tspan class="b">ci-lint-transcript session.jsonl</tspan></text>
<text x="40" y="128" font-size="18" class="mute" xml:space="preserve">session.jsonl: an Edit of src/app.ts, then a git commit</text>
<line x1="40" y1="142" x2="600" y2="142" class="rule" stroke-width="1"/>
<text x="40" y="172" font-size="18" class="mute mono" xml:space="preserve"><tspan class="b">Agent Discipline Report</tspan></text>
<text x="40" y="198" font-size="18" class="tx mono" xml:space="preserve"><tspan class="b">Score:</tspan> 43/100</text>
<text x="40" y="224" font-size="18" class="mute mono" xml:space="preserve"><tspan class="b">Events analyzed:</tspan> 2</text>
<text x="40" y="250" font-size="18" class="mute mono" xml:space="preserve"><tspan class="b">Tool calls:</tspan> 2</text>
<text x="40" y="276" font-size="18" class="mute mono" xml:space="preserve"><tspan class="b">Research ops:</tspan> 0 | <tspan class="b">Write ops:</tspan> 1 (1 to source or</text>
<text x="40" y="302" font-size="18" class="mute mono" xml:space="preserve">  config files) | <tspan class="b">Verify ops:</tspan> 0</text>
<text x="40" y="328" font-size="18" class="mute mono" xml:space="preserve"><tspan class="b">Violations (2)</tspan></text>
<text x="40" y="354" font-size="18" class="deny mono" xml:space="preserve"><tspan class="b">- </tspan><tspan class="b">[HIGH] Law 1: Research Before Executing</tspan></text>
<text x="40" y="380" font-size="18" class="mute mono" xml:space="preserve">  1 write with 0 research operations (first at</text>
<text x="40" y="406" font-size="18" class="mute mono" xml:space="preserve">  event 0). Agent likely skipped research.</text>
<text x="40" y="432" font-size="18" class="deny mono" xml:space="preserve"><tspan class="b">- </tspan><tspan class="b">[HIGH] Law 4: Verify Before Reporting</tspan></text>
<text x="40" y="458" font-size="18" class="mute mono" xml:space="preserve">  1 code change with 0 verification commands</text>
<text x="40" y="484" font-size="18" class="mute mono" xml:space="preserve">  (test/build). Agent may have declared done</text>
<text x="40" y="510" font-size="18" class="mute mono" xml:space="preserve">  without verifying.</text>
</svg>
