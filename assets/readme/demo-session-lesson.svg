<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 414" width="820" height="414" role="img" aria-labelledby="title desc">
<title id="title">A saved lesson reaches the next session</title>
<desc id="desc">A lesson saved with the ci_create_instinct MCP tool is printed into Gemini CLI's context by hooks/session.mjs when the next session starts.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.b{font-weight:600}.bg{fill:#ffffff}.panel{fill:#f6f8fa;stroke:#d0d7de}.rule{stroke:#d0d7de}.tx{fill:#1f2328}.mute{fill:#59636e}.deny{fill:#cf222e}.deny-bg{fill:#ffebe9;stroke:#cf222e}.ok{fill:#1a7f37}.ok-bg{fill:#dafbe1;stroke:#1a7f37}.accent{fill:#0969da}.accent-bg{fill:#ddf4ff;stroke:#0969da}.warn{fill:#9a6700}.warn-bg{fill:#fff8c5;stroke:#9a6700}.arrow{stroke:#59636e;fill:none}.head{fill:#59636e}@media (prefers-color-scheme:dark){.bg{fill:#0d1117}.panel{fill:#161b22;stroke:#3d444d}.rule{stroke:#3d444d}.tx{fill:#f0f6fc}.mute{fill:#9198a1}.deny{fill:#ff7b72}.deny-bg{fill:#3d1214;stroke:#ff7b72}.ok{fill:#3fb950}.ok-bg{fill:#12301c;stroke:#3fb950}.accent{fill:#4493f8}.accent-bg{fill:#0c2d5a;stroke:#4493f8}.warn{fill:#d29922}.warn-bg{fill:#3a2a07;stroke:#d29922}.arrow{stroke:#9198a1;fill:none}.head{fill:#9198a1}}</style>
<rect x="0" y="0" width="820" height="414" rx="12" class="bg"/>
<text x="24" y="48" font-size="24" class="tx b" xml:space="preserve">A saved lesson reaches the next session</text>
<text x="24" y="76" font-size="16" class="mute" xml:space="preserve">Captured on 3.27.0 plus the Unreleased changes: demo/captures/demos.json</text>
<rect x="24" y="94" width="772" height="296" rx="8" class="panel"/>
<text x="40" y="134" font-size="19" class="tx b" xml:space="preserve">1. Save a lesson with the MCP tool ci_create_instinct</text>
<text x="40" y="166" font-size="18" class="tx mono" xml:space="preserve">Created instinct **build-before-stage** with confidence 0.8</text>
<text x="40" y="192" font-size="18" class="mute mono" xml:space="preserve">~/.claude/instincts/&lt;hash&gt;/build-before-stage.yaml</text>
<line x1="40" y1="206" x2="780" y2="206" class="rule" stroke-width="1"/>
<text x="40" y="236" font-size="19" class="tx b" xml:space="preserve">2. Gemini CLI starts a session; hooks/session.mjs answers</text>
<text x="40" y="268" font-size="18" class="mute mono" xml:space="preserve">Notes from continuous-improvement instinct files: this</text>
<text x="40" y="294" font-size="18" class="mute mono" xml:space="preserve">repository's, and those marked [global], which load in every</text>
<text x="40" y="320" font-size="18" class="mute mono" xml:space="preserve">repository. ...</text>
<text x="40" y="346" font-size="18" class="accent mono b" xml:space="preserve">- when staging generated files: Run npm run build first; the .mjs</text>
<text x="40" y="372" font-size="18" class="accent mono b" xml:space="preserve">  files are generated. (0.8)</text>
</svg>
