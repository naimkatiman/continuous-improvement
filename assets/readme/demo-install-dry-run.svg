<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 674" width="640" height="674" role="img" aria-labelledby="title desc">
<title id="title">What --dry-run prints for Gemini CLI</title>
<desc id="desc">The installer's dry run for --target gemini --hooks, run from a clone: the runtime copy, settings.json, GEMINI.md and 28 skills it would write, two notes on Gemini CLI, and nothing written.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.b{font-weight:600}.bg{fill:#ffffff}.panel{fill:#f6f8fa;stroke:#d0d7de}.rule{stroke:#d0d7de}.tx{fill:#1f2328}.mute{fill:#59636e}.deny{fill:#cf222e}.deny-bg{fill:#ffebe9;stroke:#cf222e}.ok{fill:#1a7f37}.ok-bg{fill:#dafbe1;stroke:#1a7f37}.accent{fill:#0969da}.accent-bg{fill:#ddf4ff;stroke:#0969da}.warn{fill:#9a6700}.warn-bg{fill:#fff8c5;stroke:#9a6700}.arrow{stroke:#59636e;fill:none}.head{fill:#59636e}@media (prefers-color-scheme:dark){.bg{fill:#0d1117}.panel{fill:#161b22;stroke:#3d444d}.rule{stroke:#3d444d}.tx{fill:#f0f6fc}.mute{fill:#9198a1}.deny{fill:#ff7b72}.deny-bg{fill:#3d1214;stroke:#ff7b72}.ok{fill:#3fb950}.ok-bg{fill:#12301c;stroke:#3fb950}.accent{fill:#58a6ff}.accent-bg{fill:#0c2d5a;stroke:#58a6ff}.warn{fill:#d29922}.warn-bg{fill:#3a2a07;stroke:#d29922}.arrow{stroke:#9198a1;fill:none}.head{fill:#9198a1}}</style>
<rect x="0" y="0" width="640" height="674" rx="12" class="bg"/>
<text x="24" y="46" font-size="22" class="tx b" xml:space="preserve">What --dry-run prints for Gemini CLI</text>
<rect x="24" y="62" width="592" height="588" rx="8" class="panel"/>
<text x="40" y="102" font-size="18" class="tx mono" xml:space="preserve"><tspan class="b">$ </tspan><tspan class="b">node $HOME/continuous-improvement/bin/install.mjs</tspan></text>
<text x="40" y="128" font-size="18" class="tx mono" xml:space="preserve">  <tspan class="b">install --target gemini --hooks --dry-run</tspan></text>
<line x1="40" y1="142" x2="600" y2="142" class="rule" stroke-width="1"/>
<text x="40" y="172" font-size="18" class="mute mono" xml:space="preserve">continuous-improvement agent install (scope:</text>
<text x="40" y="198" font-size="18" class="mute mono" xml:space="preserve">  project, dry run)</text>
<text x="40" y="224" font-size="18" class="tx mono" xml:space="preserve">  · would copy the runtime →</text>
<text x="40" y="250" font-size="18" class="tx mono" xml:space="preserve">    ~/.claude/instincts/runtime/3.28.0</text>
<text x="40" y="276" font-size="18" class="tx mono" xml:space="preserve">  · would create ~/project/.gemini/settings.json</text>
<text x="40" y="302" font-size="18" class="tx mono" xml:space="preserve">    (gemini)</text>
<text x="40" y="328" font-size="18" class="tx mono" xml:space="preserve">  · would create ~/project/GEMINI.md (gemini)</text>
<text x="40" y="354" font-size="18" class="tx mono" xml:space="preserve">  · would write 28 skills to</text>
<text x="40" y="380" font-size="18" class="tx mono" xml:space="preserve">    ~/project/.gemini/skills (gemini)</text>
<text x="40" y="406" font-size="18" class="mute mono" xml:space="preserve">  ℹ Gemini CLI runs no settings.json hooks in an</text>
<text x="40" y="432" font-size="18" class="mute mono" xml:space="preserve">    untrusted folder, user-level ones included:</text>
<text x="40" y="458" font-size="18" class="mute mono" xml:space="preserve">    trust the folder in Gemini CLI.</text>
<text x="40" y="484" font-size="18" class="mute mono" xml:space="preserve">  ℹ Gemini CLI reads its own command files</text>
<text x="40" y="510" font-size="18" class="mute mono" xml:space="preserve">    (.gemini/commands (TOML)); the commands are not</text>
<text x="40" y="536" font-size="18" class="mute mono" xml:space="preserve">    copied, only the skills.</text>
<text x="40" y="562" font-size="18" class="ok mono" xml:space="preserve">Dry run: nothing was written.</text>
<line x1="40" y1="576" x2="600" y2="576" class="rule" stroke-width="1"/>
<text x="40" y="606" font-size="18" class="mute" xml:space="preserve">Files in the project afterwards:</text>
<text x="40" y="632" font-size="18" class="ok mono" xml:space="preserve">.git</text>
</svg>
