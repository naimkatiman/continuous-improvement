<text x="24" y="106" font-size="18" class="mute" xml:space="preserve">Blocks cell from src/lib/agent-support.mts.</text>
<text x="24" y="164" font-size="20" class="tx b" xml:space="preserve">Full: blocks, loads lessons at session start, has a Stop gate</text>
