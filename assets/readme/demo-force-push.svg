<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 700" width="820" height="700" role="img" aria-labelledby="title desc">
<title id="title">One hook file, six agents, the same refusal</title>
<desc id="desc">git push --force origin main sent through hooks/gateguard.mjs as Claude Code, Codex CLI, Gemini CLI, Cursor, GitHub Copilot CLI, Kiro CLI. Each reply is a deny in that agent's own format naming the rule git-push-force; git status is allowed on all six with no output.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.b{font-weight:600}.bg{fill:#ffffff}.panel{fill:#f6f8fa;stroke:#d0d7de}.rule{stroke:#d0d7de}.tx{fill:#1f2328}.mute{fill:#59636e}.deny{fill:#cf222e}.deny-bg{fill:#ffebe9;stroke:#cf222e}.ok{fill:#1a7f37}.ok-bg{fill:#dafbe1;stroke:#1a7f37}.accent{fill:#0969da}.accent-bg{fill:#ddf4ff;stroke:#0969da}.warn{fill:#9a6700}.warn-bg{fill:#fff8c5;stroke:#9a6700}.arrow{stroke:#59636e;fill:none}.head{fill:#59636e}@media (prefers-color-scheme:dark){.bg{fill:#0d1117}.panel{fill:#161b22;stroke:#3d444d}.rule{stroke:#3d444d}.tx{fill:#f0f6fc}.mute{fill:#9198a1}.deny{fill:#ff7b72}.deny-bg{fill:#3d1214;stroke:#ff7b72}.ok{fill:#3fb950}.ok-bg{fill:#12301c;stroke:#3fb950}.accent{fill:#4493f8}.accent-bg{fill:#0c2d5a;stroke:#4493f8}.warn{fill:#d29922}.warn-bg{fill:#3a2a07;stroke:#d29922}.arrow{stroke:#9198a1;fill:none}.head{fill:#9198a1}}</style>
<rect x="0" y="0" width="820" height="700" rx="12" class="bg"/>
<text x="24" y="48" font-size="24" class="tx b" xml:space="preserve">One hook file, six agents, the same refusal</text>
<text x="24" y="76" font-size="16" class="mute" xml:space="preserve">Captured on 3.27.0 plus the Unreleased changes: demo/captures/demos.json</text>
<rect x="24" y="96" width="772" height="50" rx="8" class="panel"/>
<text x="40" y="128" font-size="20" class="mute mono" xml:space="preserve">$ </text>
<text x="64" y="128" font-size="20" class="tx mono b" xml:space="preserve">git push --force origin main</text>
<rect x="24" y="160" width="772" height="68" rx="8" class="deny-bg"/>
<text x="40" y="202" font-size="20" class="tx b" xml:space="preserve">Claude Code</text>
<text x="260" y="188" font-size="18" class="deny mono b" xml:space="preserve">&quot;permissionDecision&quot;:&quot;deny&quot;</text>
<text x="260" y="214" font-size="18" class="tx mono" xml:space="preserve">Matched rule: git-push-force</text>
<rect x="24" y="236" width="772" height="68" rx="8" class="deny-bg"/>
<text x="40" y="278" font-size="20" class="tx b" xml:space="preserve">Codex CLI</text>
<text x="260" y="264" font-size="18" class="deny mono b" xml:space="preserve">&quot;permissionDecision&quot;:&quot;deny&quot;</text>
<text x="260" y="290" font-size="18" class="tx mono" xml:space="preserve">Matched rule: git-push-force</text>
<rect x="24" y="312" width="772" height="68" rx="8" class="deny-bg"/>
<text x="40" y="354" font-size="20" class="tx b" xml:space="preserve">Gemini CLI</text>
<text x="260" y="340" font-size="18" class="deny mono b" xml:space="preserve">&quot;decision&quot;:&quot;deny&quot;</text>
<text x="260" y="366" font-size="18" class="tx mono" xml:space="preserve">Matched rule: git-push-force</text>
<rect x="24" y="388" width="772" height="68" rx="8" class="deny-bg"/>
<text x="40" y="430" font-size="20" class="tx b" xml:space="preserve">Cursor</text>
<text x="260" y="416" font-size="18" class="deny mono b" xml:space="preserve">&quot;permission&quot;:&quot;deny&quot;</text>
<text x="260" y="442" font-size="18" class="tx mono" xml:space="preserve">Matched rule: git-push-force</text>
<rect x="24" y="464" width="772" height="68" rx="8" class="deny-bg"/>
<text x="40" y="506" font-size="20" class="tx b" xml:space="preserve">GitHub Copilot CLI</text>
<text x="260" y="492" font-size="18" class="deny mono b" xml:space="preserve">&quot;permissionDecision&quot;:&quot;deny&quot;</text>
<text x="260" y="518" font-size="18" class="tx mono" xml:space="preserve">Matched rule: git-push-force</text>
<rect x="24" y="540" width="772" height="68" rx="8" class="deny-bg"/>
<text x="40" y="582" font-size="20" class="tx b" xml:space="preserve">Kiro CLI</text>
<text x="260" y="568" font-size="18" class="deny mono b" xml:space="preserve">exit 2  (reason on stderr)</text>
<text x="260" y="594" font-size="18" class="tx mono" xml:space="preserve">Matched rule: git-push-force</text>
<rect x="24" y="620" width="772" height="56" rx="8" class="ok-bg"/>
<text x="40" y="655" font-size="19" class="ok b" xml:space="preserve">$ git status</text>
<text x="260" y="655" font-size="19" class="tx" xml:space="preserve">allowed on all 6: exit 0, no output</text>
</svg>
