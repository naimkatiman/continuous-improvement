<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 788" width="640" height="788" role="img" aria-labelledby="title desc">
<title id="title">Two pillars and the loop that joins them</title>
<desc id="desc">Ambition: be-ambitious, a skill: guidance the agent reads. Discipline: hooks, a log, switches, Node scripts on your machine. The loop, in order: Research (Law 1), Plan (Law 2), Implement (Law 3), Review (Law 4), Contemplate (Law 5), Relearn and learn (Law 7), Iterate (Law 6). 2 steps have a hook that refuses by default: Research and Implement. 2 have a gate that is off until you switch it on: Plan and Review. Relearn and learn records and loads. Contemplate and Iterate are written rules with no hook.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.b{font-weight:600}.bg{fill:#ffffff}.panel{fill:#f6f8fa;stroke:#d0d7de}.rule{stroke:#d0d7de}.tx{fill:#1f2328}.mute{fill:#59636e}.deny{fill:#cf222e}.deny-bg{fill:#ffebe9;stroke:#cf222e}.ok{fill:#1a7f37}.ok-bg{fill:#dafbe1;stroke:#1a7f37}.accent{fill:#0969da}.accent-bg{fill:#ddf4ff;stroke:#0969da}.warn{fill:#9a6700}.warn-bg{fill:#fff8c5;stroke:#9a6700}.arrow{stroke:#59636e;fill:none}.head{fill:#59636e}@media (prefers-color-scheme:dark){.bg{fill:#0d1117}.panel{fill:#161b22;stroke:#3d444d}.rule{stroke:#3d444d}.tx{fill:#f0f6fc}.mute{fill:#9198a1}.deny{fill:#ff7b72}.deny-bg{fill:#3d1214;stroke:#ff7b72}.ok{fill:#3fb950}.ok-bg{fill:#12301c;stroke:#3fb950}.accent{fill:#58a6ff}.accent-bg{fill:#0c2d5a;stroke:#58a6ff}.warn{fill:#d29922}.warn-bg{fill:#3a2a07;stroke:#d29922}.arrow{stroke:#9198a1;fill:none}.head{fill:#9198a1}}</style>
<rect x="0" y="0" width="640" height="788" rx="12" class="bg"/>
<rect x="24" y="24" width="288" height="144" rx="8" class="accent-bg"/>
<text x="40" y="54" font-size="20" class="accent b" xml:space="preserve">Ambition</text>
<text x="40" y="81" font-size="18" class="tx" xml:space="preserve">you have big goals</text>
<text x="40" y="106" font-size="18" class="tx mono" xml:space="preserve">be-ambitious</text>
<text x="40" y="131" font-size="18" class="tx" xml:space="preserve">a skill: guidance the</text>
<text x="40" y="156" font-size="18" class="tx" xml:space="preserve">agent reads</text>
<rect x="328" y="24" width="288" height="144" rx="8" class="ok-bg"/>
<text x="344" y="54" font-size="20" class="ok b" xml:space="preserve">Discipline</text>
<text x="344" y="81" font-size="18" class="tx" xml:space="preserve">you control the AI</text>
<text x="344" y="106" font-size="18" class="tx" xml:space="preserve">hooks, a log, switches</text>
<text x="344" y="131" font-size="18" class="tx" xml:space="preserve">Node scripts on your</text>
<text x="344" y="156" font-size="18" class="tx" xml:space="preserve">machine</text>
<text x="24" y="206" font-size="20" class="tx" xml:space="preserve"><tspan class="b">The loop</tspan>: seven steps, and the code behind each</text>
<rect x="52" y="222" width="564" height="66" rx="8" class="deny-bg"/>
<text x="68" y="250" font-size="20" class="tx b" xml:space="preserve">1. Research</text>
<text x="600" y="250" font-size="18" class="deny b" text-anchor="end" xml:space="preserve">refuses by default</text>
<text x="68" y="276" font-size="18" class="tx" xml:space="preserve">Law 1</text>
<text x="132.4" y="276" font-size="18" class="tx mono" xml:space="preserve">hooks/gateguard.mjs</text>
<text x="600" y="276" font-size="18" class="tx" text-anchor="end" xml:space="preserve">an edit with no read</text>
<rect x="52" y="296" width="564" height="66" rx="8" class="warn-bg"/>
<text x="68" y="324" font-size="20" class="tx b" xml:space="preserve">2. Plan</text>
<text x="600" y="324" font-size="18" class="warn b" text-anchor="end" xml:space="preserve">off until you switch it on</text>
<text x="68" y="350" font-size="18" class="tx" xml:space="preserve">Law 2</text>
<text x="132.4" y="350" font-size="18" class="tx mono" xml:space="preserve">hooks/goal-drift-stop.mjs</text>
<text x="600" y="350" font-size="18" class="tx" text-anchor="end" xml:space="preserve">Claude Code only</text>
<rect x="52" y="370" width="564" height="66" rx="8" class="deny-bg"/>
<text x="68" y="398" font-size="20" class="tx b" xml:space="preserve">3. Implement</text>
<text x="600" y="398" font-size="18" class="deny b" text-anchor="end" xml:space="preserve">refuses by default</text>
<text x="68" y="424" font-size="18" class="tx" xml:space="preserve">Law 3</text>
<text x="132.4" y="424" font-size="18" class="tx mono" xml:space="preserve">hooks/gateguard.mjs</text>
<text x="600" y="424" font-size="18" class="tx" text-anchor="end" xml:space="preserve">destructive commands</text>
<rect x="52" y="444" width="564" height="66" rx="8" class="warn-bg"/>
<text x="68" y="472" font-size="20" class="tx b" xml:space="preserve">4. Review</text>
<text x="600" y="472" font-size="18" class="warn b" text-anchor="end" xml:space="preserve">off until you switch it on</text>
<text x="68" y="498" font-size="18" class="tx" xml:space="preserve">Law 4</text>
<text x="132.4" y="498" font-size="18" class="tx mono" xml:space="preserve">hooks/typecheck-stop.mjs</text>
<text x="600" y="498" font-size="18" class="tx" text-anchor="end" xml:space="preserve">TypeScript only</text>
<rect x="52" y="518" width="564" height="66" rx="8" class="panel"/>
<text x="68" y="546" font-size="20" class="tx b" xml:space="preserve">5. Contemplate</text>
<text x="600" y="546" font-size="18" class="mute b" text-anchor="end" xml:space="preserve">none</text>
<text x="68" y="572" font-size="18" class="mute" xml:space="preserve">Law 5</text>
<text x="132.4" y="572" font-size="18" class="mute" xml:space="preserve">a written rule, no hook</text>
<rect x="52" y="592" width="564" height="66" rx="8" class="accent-bg"/>
<text x="68" y="620" font-size="20" class="tx b" xml:space="preserve">6. Relearn and learn</text>
<text x="600" y="620" font-size="18" class="accent b" text-anchor="end" xml:space="preserve">records and loads</text>
<text x="68" y="646" font-size="18" class="tx" xml:space="preserve">Law 7</text>
<text x="132.4" y="646" font-size="18" class="tx mono" xml:space="preserve">bin/observe.mjs, hooks/session.mjs</text>
<rect x="52" y="666" width="564" height="66" rx="8" class="panel"/>
<text x="68" y="694" font-size="20" class="tx b" xml:space="preserve">7. Iterate</text>
<text x="600" y="694" font-size="18" class="mute b" text-anchor="end" xml:space="preserve">none</text>
<text x="68" y="720" font-size="18" class="mute" xml:space="preserve">Law 6</text>
<text x="132.4" y="720" font-size="18" class="mute" xml:space="preserve">a written rule, no hook</text>
<path d="M 52 699 H 34 V 255 H 43" class="arrow" stroke-width="2"/>
<polygon points="52,255 42,249 42,261" class="head"/>
<text x="320" y="764" font-size="18" class="mute" text-anchor="middle" xml:space="preserve">A skill is guidance. Only a hook can refuse a call.</text>
</svg>
