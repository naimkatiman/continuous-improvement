<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 458" width="640" height="458" role="img" aria-labelledby="title desc">
<title id="title">The goal check on two tool-call logs</title>
<desc id="desc">The ci_plan_init MCP tool writes a goal into task_plan.md. The ci_goal_check MCP tool then answers DRIFT for four logged calls that share no keyword with the goal, and ON GOAL for four that do.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.b{font-weight:600}.bg{fill:#ffffff}.panel{fill:#f6f8fa;stroke:#d0d7de}.rule{stroke:#d0d7de}.tx{fill:#1f2328}.mute{fill:#59636e}.deny{fill:#cf222e}.deny-bg{fill:#ffebe9;stroke:#cf222e}.ok{fill:#1a7f37}.ok-bg{fill:#dafbe1;stroke:#1a7f37}.accent{fill:#0969da}.accent-bg{fill:#ddf4ff;stroke:#0969da}.warn{fill:#9a6700}.warn-bg{fill:#fff8c5;stroke:#9a6700}.arrow{stroke:#59636e;fill:none}.head{fill:#59636e}@media (prefers-color-scheme:dark){.bg{fill:#0d1117}.panel{fill:#161b22;stroke:#3d444d}.rule{stroke:#3d444d}.tx{fill:#f0f6fc}.mute{fill:#9198a1}.deny{fill:#ff7b72}.deny-bg{fill:#3d1214;stroke:#ff7b72}.ok{fill:#3fb950}.ok-bg{fill:#12301c;stroke:#3fb950}.accent{fill:#58a6ff}.accent-bg{fill:#0c2d5a;stroke:#58a6ff}.warn{fill:#d29922}.warn-bg{fill:#3a2a07;stroke:#d29922}.arrow{stroke:#9198a1;fill:none}.head{fill:#9198a1}}</style>
<rect x="0" y="0" width="640" height="458" rx="12" class="bg"/>
<text x="24" y="46" font-size="22" class="tx b" xml:space="preserve">The goal check on two tool-call logs</text>
<rect x="24" y="62" width="592" height="372" rx="8" class="panel"/>
<text x="40" y="102" font-size="18" class="tx b" xml:space="preserve">1. ci_plan_init writes task_plan.md</text>
<text x="40" y="134" font-size="18" class="tx mono" xml:space="preserve"><tspan class="b">Goal:</tspan> Add retry with backoff to the payment webhook</text>
<text x="40" y="160" font-size="18" class="tx mono" xml:space="preserve">  handler</text>
<line x1="40" y1="174" x2="600" y2="174" class="rule" stroke-width="1"/>
<text x="40" y="204" font-size="18" class="tx b" xml:space="preserve">2. ci_goal_check: four logged calls on other files</text>
<text x="40" y="236" font-size="18" class="deny mono" xml:space="preserve"><tspan class="b">Status:</tspan><tspan class="b"> DRIFT</tspan></text>
<text x="40" y="262" font-size="18" class="tx mono" xml:space="preserve"><tspan class="b">Score:</tspan> 0% (0/4 matched, threshold 30%)</text>
<text x="40" y="288" font-size="18" class="mute mono" xml:space="preserve"><tspan class="b">Goal keywords:</tspan> retry, backoff, payment, webhook,</text>
<text x="40" y="314" font-size="18" class="mute mono" xml:space="preserve">  handler</text>
<line x1="40" y1="328" x2="600" y2="328" class="rule" stroke-width="1"/>
<text x="40" y="358" font-size="18" class="tx b" xml:space="preserve">3. ci_goal_check: four logged calls on the webhook handler</text>
<text x="40" y="390" font-size="18" class="ok mono" xml:space="preserve"><tspan class="b">Status:</tspan><tspan class="b"> ON GOAL</tspan></text>
<text x="40" y="416" font-size="18" class="tx mono" xml:space="preserve"><tspan class="b">Score:</tspan> 100% (4/4 matched, threshold 30%)</text>
</svg>
