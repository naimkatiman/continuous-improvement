<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Page not found · continuous-improvement</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2.5' y='2.5' width='27' height='27' rx='6' fill='%23faf7f0' stroke='%23231f17' stroke-width='2'/%3E%3Cpath d='M8 24 L24 8' stroke='%23d24a2e' stroke-width='4' stroke-linecap='round'/%3E%3Crect x='13' y='13' width='6' height='6' rx='1.5' fill='%23231f17'/%3E%3C/svg%3E">
<style>
/* The not-found page of continuous-improvement.dev, cut from index.html: same tokens, same fonts.
   Paths are absolute because this file is served for any missing address, at any depth. */
@font-face { font-family: "Newsreader Display"; font-style: normal; font-weight: 400 600; font-display: swap; src: url(/fonts/newsreader-display.woff2) format("woff2"); }
@font-face { font-family: "Newsreader"; font-style: normal; font-weight: 400 650; font-display: swap; src: url(/fonts/newsreader-text.woff2) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 400 700; font-display: swap; src: url(/fonts/jetbrains-mono.woff2) format("woff2"); }
:root {
  --paper: oklch(0.985 0.006 85);
  --ink: oklch(0.205 0.012 55);
  --ink-soft: oklch(0.34 0.012 58);
  --muted: oklch(0.5 0.012 60);
  --line-strong: oklch(0.8 0.008 78);
  --signal: oklch(0.56 0.18 33);
  --serif: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --display: "Newsreader Display", "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: oklch(0.185 0.01 55);
    --ink: oklch(0.95 0.008 85);
    --ink-soft: oklch(0.86 0.01 82);
    --muted: oklch(0.72 0.012 75);
    --line-strong: oklch(0.43 0.01 62);
    --signal: oklch(0.7 0.17 36);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; display: flex; flex-direction: column; font-family: var(--serif); font-size: 1.125rem; line-height: 1.5; background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: .18em; text-decoration-color: var(--muted); }
a:hover { text-decoration-color: var(--signal); text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }
.wrap { width: 100%; max-width: 1320px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); }
header { border-bottom: 1px solid var(--line-strong); }
.bar { display: flex; align-items: center; height: 54px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 600 .875rem var(--mono); letter-spacing: -.02em; }
.brand svg { width: 24px; height: 24px; display: block; }
main { flex: 1; padding: clamp(28px, 5vw, 64px) 0; }
.sheet { max-width: 40rem; }
.label { font: 500 .75rem/1.5 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-size: clamp(2.2rem, 1.2rem + 4vw, 3.4rem); font-weight: 500; line-height: 1; letter-spacing: -.026em; margin: 14px 0 26px; }
.entry > div { padding: 10px 0 11px; border-top: 1px solid var(--line-strong); }
.entry > div:last-child { border-bottom: 1px solid var(--line-strong); }
.entry dt { font: 600 .75rem/1.5 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.entry dd { font-family: var(--mono); overflow-wrap: anywhere; }
.entry .cmd { font-size: clamp(1.1rem, .9rem + 1.2vw, 1.6rem); font-weight: 500; letter-spacing: -.03em; line-height: 1.2; margin-top: 4px; }
.entry .verdict { font-size: clamp(4.6rem, 2.6rem + 8.4vw, 8.6rem); font-weight: 700; letter-spacing: -.065em; line-height: .8; color: var(--signal); padding: .07em 0 .09em; margin-left: -.04em; }
p { color: var(--ink-soft); margin-top: 22px; max-width: 34em; }
.links { display: flex; flex-wrap: wrap; gap: 8px 24px; font: 500 .8125rem var(--mono); color: var(--ink); }
footer { border-top: 1px solid var(--line-strong); padding: 22px 0 28px; font: 500 .75rem var(--mono); letter-spacing: .1em; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="/">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2.5" y="2.5" width="27" height="27" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 24 L24 8" stroke="var(--signal)" stroke-width="4" stroke-linecap="round"/><rect x="13" y="13" width="6" height="6" rx="1.5" fill="currentColor"/></svg>
      <span>continuous-improvement</span>
    </a>
  </div>
</header>
<main>
  <div class="wrap">
    <div class="sheet">
      <span class="label">Case file / Page not found</span>
      <h1>No page at this address.</h1>
      <dl class="entry">
        <div><dt>Attempt</dt><dd class="cmd" id="path">this address</dd></div>
        <div><dt>Verdict</dt><dd class="verdict">404</dd></div>
      </dl>
      <p>The site is one page. Everything the plugin installs, what it costs and how to turn it off is on it.</p>
      <p class="links"><a href="/">continuous-improvement.dev</a> <a href="https://github.com/naimkatiman/continuous-improvement">Source on GitHub</a></p>
    </div>
  </div>
</main>
<footer>
  <div class="wrap">DOC. CI-7L &middot; MIT LICENSE</div>
</footer>
<script>
// Show the address that was asked for. Set as text, never as markup.
(function () {
  var el = document.getElementById("path");
  if (el && location.pathname && location.pathname !== "/404.html") el.textContent = "GET " + location.pathname;
})();
</script>
</body>
</html>
